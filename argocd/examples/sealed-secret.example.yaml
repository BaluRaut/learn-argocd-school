# What a committed SealedSecret looks like. It is encrypted with YOUR cluster's public key,
# so this exact file will not decrypt anywhere else — that is the point. Generate your own
# with the kubeseal steps in lessons/12-secrets-and-compare/README.md (branch lesson-12).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-pass
  namespace: gitops-school
spec:
  encryptedData:
    password: AgBy8hCi3vN...   # ~700 characters of ciphertext in a real file; safe to publish
  template:
    metadata:
      name: db-pass
      namespace: gitops-school
    type: Opaque
