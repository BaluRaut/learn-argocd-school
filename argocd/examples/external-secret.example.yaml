# The External Secrets Operator shape: the book holds only a POINTER to the real secret.
# Needs: ESO installed, and a ClusterSecretStore allowed to read AWS Secrets Manager —
# on EKS, an IAM role for the operator's service account (AWS school L04, Kubernetes school L17).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-pass
  namespace: gitops-school
spec:
  refreshInterval: 1h                  # re-fetched every hour → rotation for free
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-pass                      # the real Secret ESO creates inside the cluster
  data:
    - secretKey: password
      remoteRef:
        key: school/db                 # the secret's name in AWS Secrets Manager
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets     # bound to an IAM role via IRSA / Pod Identity
            namespace: external-secrets
