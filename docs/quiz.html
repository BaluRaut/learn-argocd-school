<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — 🤖 ArgoCD & GitOps</title>
<meta name="description" content="Self-test quiz for the 🤖 ArgoCD & GitOps school — 8 questions with explanations.">
<meta property="og:title" content="Quiz — 🤖 ArgoCD & GitOps"><meta property="og:description" content="8 questions with explanations. Can you pass?"><meta property="og:image" content="https://baluraut.github.io/learn-argocd-school/images/big-picture-4k.png"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image">
<style>
:root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#ea580c; --ok:#16a34a; --bad:#dc2626; --blue:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#131c2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#253349; } }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
.wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
a { color:var(--blue); } h1 { font-size:1.9rem; }
.sub { color:var(--muted); }
.scorebox { position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
.score { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; font-weight:700; }
.qcard { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:14px; padding:18px 20px; margin-top:16px; }
.qcard h3 { font-size:1.02rem; margin-bottom:10px; }
.opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
.opt:hover { border-color:var(--accent); }
.opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--bg)); }
.opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.why { display:none; margin-top:10px; color:var(--muted); font-size:.92rem; border-top:1px dashed var(--line); padding-top:8px; }
.reset { margin-top:20px; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
footer { margin-top:44px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:.88rem; }
</style></head><body><div class="wrap">
<p><a href="index.html">← Back to the course home</a></p>
<h1>🧪 The 🤖 ArgoCD & GitOps quiz</h1>
<p class="sub">8 questions — pick an answer, get the why. One attempt per question (until reset).
Your best score is saved in this browser.</p>
<div class="scorebox"><div class="score" id="score">0 / 8 · best: —</div></div>
<div id="quiz"></div>
<button class="reset" onclick="reset()">↺ Reset & retake</button>
<footer>Part of <a href="https://baluraut.github.io/school/">🏫 The School</a> · <a href="index.html">course home</a> ·
  <a href="https://github.com/BaluRaut/learn-argocd-school/issues">🐛 found a mistake?</a>
</footer>
</div>
<script>
var QS = [{"q": "GitOps' single source of truth?", "o": ["The cluster", "The git repo — reality must match the book", "The CI server"], "c": 1, "w": "L05: read the book, walk the halls, fix differences, forever."}, {"q": "Pull vs push deployment?", "o": ["Same result, same risk", "An in-cluster agent PULLS from git — cluster keys never leave home", "Pull is slower so worse"], "c": 1, "w": "L04/L05: the courier carries keys around town; the caretaker lives inside."}, {"q": "OutOfSync means…", "o": ["The app crashed", "Git and cluster differ — a comparison result, not an error", "Network down"], "c": 1, "w": "L08: it's the yellow sign, awaiting sync (or auto-sync)."}, {"q": "selfHeal: true does what?", "o": ["Restarts pods", "Reverts manual cluster edits back to what git says", "Fixes YAML typos"], "c": 1, "w": "L09: kubectl-scale by hand → back to the book within minutes."}, {"q": "prune: true does what?", "o": ["Deletes old images", "Deletes cluster resources that were removed from git", "Compresses manifests"], "c": 1, "w": "L08: gone from the book = gone from the room — the book fully rules."}, {"q": "The durable rollback in GitOps?", "o": ["ArgoCD's rollback button alone", "git revert — the book must change or auto-sync reapplies the bad state", "Delete the pod"], "c": 1, "w": "L10: UI rollback + auto-sync = the book wins again; revert the commit."}, {"q": "An ArgoCD Application specifies…", "o": ["Image + replicas", "repo URL + path + target revision + destination", "A Helm license"], "c": 1, "w": "L07: which book, which chapter, which room."}, {"q": "Secrets in a GitOps repo?", "o": ["Base64 is enough", "Never plaintext — Sealed Secrets or External Secrets", "Private repo makes it safe"], "c": 1, "w": "L12: git never forgets; encrypt in, or point out."}];
var KEY='quiz-argocd-school', answered={}, score=0;
var best = parseInt(localStorage.getItem(KEY)||'-1');
function render() {
  var el = document.getElementById('quiz'); el.innerHTML='';
  QS.forEach(function(q,i) {
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<h3>'+(i+1)+'. '+q.q+'</h3>';
    q.o.forEach(function(opt,j) {
      var b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=function() {
        if (answered[i]!==undefined) return;
        answered[i]=j;
        if (j===q.c) { b.classList.add('right'); score++; }
        else { b.classList.add('wrong'); card.querySelectorAll('.opt')[q.c].classList.add('right'); }
        card.querySelector('.why').style.display='block';
        update();
      };
      card.appendChild(b);
    });
    var why=document.createElement('div'); why.className='why'; why.textContent='💡 '+q.w;
    card.appendChild(why);
    el.appendChild(card);
  });
}
function update() {
  var done=Object.keys(answered).length;
  if (done===QS.length && score>best) { best=score; localStorage.setItem(KEY,best); }
  document.getElementById('score').textContent=score+' / '+QS.length+(done===QS.length?' — done! 🎓':'')+' · best: '+(best<0?'—':best+'/'+QS.length);
}
function reset() { answered={}; score=0; render(); update(); }
render(); update();
</script></body></html>
